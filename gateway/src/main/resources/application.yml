server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          # 开启从注册中心自动创建路由
          enabled: true
          lower-case-service-id: true
      routes:
        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        # 通知服务路由
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        # MCP 服务路由
        - id: mcp-server
          uri: lb://mcp-server
          predicates:
            - Path=/mcp/**

eureka:
  client:
    service-url:
      # 若 Eureka 启用了安全认证，格式为: ******host:port/eureka/
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
