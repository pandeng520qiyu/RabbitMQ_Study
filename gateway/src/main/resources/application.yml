server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      discovery:
        locator:
          # 开启从注册中心自动创建路由
          enabled: true
          lower-case-service-id: true
      routes:
        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        # 通知服务路由
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        # MCP 服务路由
        - id: mcp-server
          uri: lb://mcp-server
          predicates:
            - Path=/mcp/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
