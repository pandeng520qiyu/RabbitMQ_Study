server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      discovery:
        locator:
          # 开启从注册中心自动创建路由
          enabled: true
          lower-case-service-id: true
      routes:
        # 认证服务路由（无需鉴权，放在最前）
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        # 通知服务路由
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        # MCP 服务路由
        - id: mcp-server
          uri: lb://mcp-server
          predicates:
            - Path=/mcp/**

# JWT 配置（与 user-service 保持一致）
jwt:
  secret: ${JWT_SECRET:rabbitmq-study-secret-key-must-be-at-least-32bytes!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
