server:
  port: 8081

spring:
  application:
    name: order-service

  # H2 内存数据库（无需安装，学习用）
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      # 访问 H2 控制台：http://localhost:8081/h2-console
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # RabbitMQ 连接配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /
    # Publisher Confirm（消息到达交换机的确认）
    publisher-confirm-type: correlated
    # 消息到达队列的确认（路由失败时返回）
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK（消费者处理完才确认）
        acknowledge-mode: manual
        # 预取数量（Work Queue 中每个消费者最多同时处理的消息数）
        prefetch: 1
        # 并发消费者数（演示 Work Queue 竞争消费）
        concurrency: 2
        max-concurrency: 5

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.study: DEBUG
    org.springframework.amqp: DEBUG
