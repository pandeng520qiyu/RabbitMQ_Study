server:
  port: 8082

spring:
  application:
    name: notification-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /
    listener:
      simple:
        # 手动 ACK 模式（最重要的配置！）
        acknowledge-mode: manual
        # 每个消费者最多同时持有1条未确认消息（公平分发）
        prefetch: 1
        # 并发消费者数（演示 Work Queue 竞争消费）
        concurrency: 2
        max-concurrency: 5
        # 消费失败重试（3次后进入死信队列）
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.study: DEBUG
    org.springframework.amqp: INFO
